name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The extension ships zero dependencies, so Playwright is installed
      # globally here rather than added to the repo as a devDependency.
      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Source-level validation
        run: node scripts/validate-extension.js

      - name: Popup end-to-end behaviour tests
        run: node scripts/test-popup-e2e.js
