name: Auto version bump

# Any push to master that changes shipped extension files gets a patch bump,
# committed back by the bot. Loop protection is threefold: the bot's own commits
# are skipped by author check, its commit message carries [skip bump], and a push
# that already changed the version is left alone.

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: >-
      github.event.head_commit != null &&
      !contains(github.event.head_commit.message, '[skip bump]') &&
      github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Decide whether a bump is needed
        id: decide
        run: |
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          if [ -z "$BEFORE" ]; then
            echo "reason=no comparable base commit" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "Changed files:"; echo "$CHANGED"

          # Only shipped runtime files justify a version bump.
          if ! echo "$CHANGED" | grep -Eq '^(manifest\.json|popup\.(html|css|js)|icons/)'; then
            echo "reason=no runtime files changed" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Respect a version the author already bumped by hand.
          if git diff "$BEFORE" "${{ github.sha }}" -- manifest.json | grep -Eq '^\+\s*"version"'; then
            echo "reason=version already changed in this push" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.decide.outputs.bump != 'true'
        run: echo "No bump — ${{ steps.decide.outputs.reason }}"

      - name: Bump patch version
        if: steps.decide.outputs.bump == 'true'
        id: bumped
        run: |
          node scripts/bump-version.js patch
          echo "version=$(node scripts/bump-version.js --print)" >> "$GITHUB_OUTPUT"

      - name: Validate the bumped tree
        if: steps.decide.outputs.bump == 'true'
        run: node scripts/validate-extension.js

      - name: Commit and push
        if: steps.decide.outputs.bump == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json package.json popup.html
          git commit -m "chore(release): v${{ steps.bumped.outputs.version }} [skip bump]"
          git push origin HEAD:master
