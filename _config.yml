title: 1132 Fixer for Chrome
description: Clear Zoom site data in Chrome with one guided action. Cookies only. MV3, user-triggered, no telemetry, no remote code.

# No theme — we ship our own _layouts/default.html and assets/site.css.
# This keeps the rendered page free of any external GitHub Pages theme assets.

include:
  - PRIVACY_POLICY.md

exclude:
  - node_modules
  - store-assets
  - scripts
  - ds-bundle
  - .design-sync
  - .github
  - install.bat
  - STORE_PREP.md
  - 1132-fixer-chrome.zip
  - package.json
  - package-lock.json
  - .gitignore
  - LICENSE

plugins: []
