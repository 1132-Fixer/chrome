<!-- @dsCard group="Brand" -->
<style>
  :root { --amber-400:#f5a623; --amber-500:#ff8c00; --amber-glow:rgba(245,166,35,0.55); --text-dim:#8ca4c0; --font:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif; }
  body { margin:0; padding:28px; font-family:var(--font); background:linear-gradient(170deg,#0a1020,#081018 45%,#050a14); }
  .logo-lockup { display:flex; flex-direction:column; align-items:center; gap:5px; }
  .logo-title { font-size:22px; font-weight:900; letter-spacing:3px; line-height:1; background:linear-gradient(180deg,#ffe066,#ffd700,var(--amber-400)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; filter:drop-shadow(0 2px 8px var(--amber-glow)); }
  .logo-sep { width:46px; height:3px; border-radius:2px; background:linear-gradient(90deg,var(--amber-500),var(--amber-400)); }
  .logo-desc { color:var(--text-dim); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; }
</style>
<div class="logo-lockup">
  <span class="logo-title">1132 FIXER</span>
  <div class="logo-sep"></div>
  <span class="logo-desc">Zoom Cookie Cleaner</span>
</div>
