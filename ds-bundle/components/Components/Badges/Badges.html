<!-- @dsCard group="Components" -->
<style>
  :root { --surface:#1e2b46; --border:rgba(255,255,255,0.08); --border-hi:rgba(58,130,247,0.4); --accent-soft:#8fc2ff; --text:#f4f7fb; --text-dim:#9ca8bd; --radius-pill:999px; }
  body { margin:0; padding:24px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-family:'Segoe UI Variable','Segoe UI',sans-serif; background:linear-gradient(180deg,#17243a,#203857); }
  .badge { display:inline-flex; align-items:center; white-space:nowrap; line-height:1; min-height:44px; font-size:12px; font-weight:600; letter-spacing:0.2px; padding:8px 14px; border-radius:var(--radius-pill); }
  .badge.static { min-height:0; padding:6px 12px; }
  .version-badge { color:var(--text-dim); border:1px solid var(--border); background:var(--surface); }
  .scope-badge { color:var(--accent-soft); border:1px solid var(--border-hi); background:rgba(58,130,247,0.1); }
  .site-link { color:var(--text); border:1px solid var(--border); background:var(--surface); text-decoration:none; }
  .site-link:hover { border-color:var(--border-hi); color:var(--accent-soft); }
</style>
<span class="badge static version-badge">v1.2.1</span>
<span class="badge static scope-badge">Cookies only</span>

     preview card keeps it intentionally inert. -->
