<!-- @dsCard group="Components" -->
<style>
  :root { --accent:#3a82f7; --accent-hover:#4b93ff; --accent-down:#2f6fd6; --radius-btn:8px; }
  body { margin:0; padding:24px; display:flex; flex-direction:column; gap:12px; width:312px; font-family:'Segoe UI Variable','Segoe UI',sans-serif; background:linear-gradient(180deg,#17243a,#203857); }
  .btn-zoom { width:100%; min-height:48px; padding:14px 24px; border-radius:var(--radius-btn); border:none; cursor:pointer; background:var(--accent); color:#fff; font-family:inherit; font-size:15px; font-weight:600; letter-spacing:2px; box-shadow:0 2px 8px rgba(0,0,0,0.35); transition:background 0.15s ease, transform 0.15s ease; }
  .btn-zoom:hover:not(:disabled) { background:var(--accent-hover); transform:translateY(-1px); }
  .btn-zoom:active:not(:disabled) { background:var(--accent-down); transform:none; }
  .btn-zoom:disabled { opacity:0.45; cursor:progress; }
</style>
<button class="btn-zoom" type="button">FIX ZOOM</button>
<button class="btn-zoom" type="button" disabled>FIX ZOOM</button>
