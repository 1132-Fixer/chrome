<!-- @dsCard group="Components" -->
<style>
  :root { --surface:#1e2b46; --border:rgba(255,255,255,0.08); --green-500:#39d353; --amber-400:#f2c94c; --red-500:#f85149; --text-dim:#9ca8bd; --radius-pill:999px; }
  body { margin:0; padding:24px; display:flex; gap:10px; flex-wrap:wrap; font-family:'Segoe UI Variable','Segoe UI',sans-serif; background:linear-gradient(180deg,#17243a,#203857); }
  .status-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:var(--radius-pill); color:var(--green-500); font-size:12px; font-weight:700; letter-spacing:1.4px; border:1px solid rgba(57,211,83,0.45); background:rgba(57,211,83,0.1); }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green-500); box-shadow:0 0 4px var(--green-500); }
  .status-badge.scanning { color:var(--amber-400); border-color:rgba(242,201,76,0.45); background:rgba(242,201,76,0.1); }
  .status-badge.scanning .status-dot { background:var(--amber-400); box-shadow:0 0 4px var(--amber-400); }
  .status-badge.error { color:var(--red-500); border-color:rgba(248,81,73,0.45); background:rgba(248,81,73,0.1); }
  .status-badge.error .status-dot { background:var(--red-500); box-shadow:0 0 4px var(--red-500); }
  .status-badge.neutral { color:var(--text-dim); border-color:var(--border); background:var(--surface); }
  .status-badge.neutral .status-dot { background:var(--text-dim); box-shadow:none; }
</style>
<span class="status-badge"><span class="status-dot"></span>READY</span>
<span class="status-badge scanning"><span class="status-dot"></span>SCANNING</span>
<span class="status-badge error"><span class="status-dot"></span>ERROR</span>
<span class="status-badge neutral"><span class="status-dot"></span>NOT ZOOM</span>
