<style>
  :root { --amber-400:#f5a623; --amber-500:#ff8c00; --amber-glow:rgba(245,166,35,0.55); --blue-300:#4aa3ff; --blue-400:#2d8cff; --blue-600:#1a6fb5; --green-500:#22c55e; --text:#f0f0f0; --text-dim:#8ca4c0; --radius-pill:50px; }
  body { margin:0; padding:24px; display:flex; gap:24px; flex-wrap:wrap; background:#02040a; font-family:'Segoe UI',sans-serif; }
  .popup { width:360px; display:flex; flex-direction:column; border-radius:10px; overflow:hidden; color:var(--text); background:linear-gradient(170deg,#0a1020,#081018 45%,#050a14); box-shadow:0 12px 40px rgba(0,0,0,0.6); }
  .header { display:flex; flex-direction:column; align-items:center; gap:5px; padding:18px 20px 0; }
  .logo-title { font-size:22px; font-weight:900; letter-spacing:3px; line-height:1; background:linear-gradient(180deg,#ffe066,#ffd700,var(--amber-400)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; filter:drop-shadow(0 2px 8px var(--amber-glow)); }
  .logo-sep { width:46px; height:3px; border-radius:2px; background:linear-gradient(90deg,var(--amber-500),var(--amber-400)); }
  .logo-desc { color:var(--text-dim); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; }
  .main { display:flex; flex-direction:column; align-items:center; gap:14px; padding:18px 20px 20px; }
  .status-badge { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:var(--radius-pill); color:var(--green-500); font-size:10.5px; font-weight:800; letter-spacing:1.4px; border:1.5px solid rgba(34,197,94,0.5); background:linear-gradient(145deg,rgba(34,197,94,0.15),rgba(34,197,94,0.06)); }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green-500); box-shadow:0 0 6px var(--green-500); }
  .status-badge.neutral { color:var(--text-dim); border-color:rgba(255,255,255,0.14); background:linear-gradient(145deg,rgba(255,255,255,0.07),rgba(255,255,255,0.03)); }
  .status-badge.neutral .status-dot { background:var(--text-dim); box-shadow:none; }
  .btn-zoom { width:100%; padding:17px 24px; border-radius:30px; border:2px solid rgba(255,255,255,0.18); background:linear-gradient(145deg,var(--blue-300),var(--blue-400),var(--blue-600)); color:#fff; font-family:inherit; font-size:15px; font-weight:900; letter-spacing:3.5px; box-shadow:0 0 30px rgba(45,140,255,0.32),0 4px 16px rgba(0,0,0,0.4); }
  .result { min-height:30px; color:var(--text-dim); font-size:11.5px; line-height:1.5; text-align:center; }
  .result.good { color:var(--green-500); font-weight:600; }
  .footer { margin-top:auto; }
  .hazard-bar { height:6px; opacity:0.7; background:repeating-linear-gradient(-45deg,#f5c518,#f5c518 8px,#1a1a1a 8px,#1a1a1a 16px); }
  .footer-content { display:flex; justify-content:space-between; padding:8px 14px; }
  .badge { font-size:10px; font-weight:700; letter-spacing:1.3px; padding:5px 12px; border-radius:var(--radius-pill); }
  .version-badge { color:var(--text-dim); border:1.5px solid rgba(255,255,255,0.12); background:linear-gradient(145deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03)); }
  .scope-badge { color:var(--amber-400); border:1.5px solid rgba(245,166,35,0.45); background:linear-gradient(145deg,rgba(245,166,35,0.14),rgba(245,166,35,0.05)); text-transform:uppercase; }
</style>
<div class="popup">
  <div class="header"><span class="logo-title">1132 FIXER</span><div class="logo-sep"></div><span class="logo-desc">Zoom Cookie Cleaner</span></div>
  <div class="main">
    <span class="status-badge"><span class="status-dot"></span>READY · zoom.us</span>
    <button class="btn-zoom" type="button">FIX ZOOM</button>
    <p class="result">One click clears zoom.us and zoom.com cookies, then reloads this tab.</p>
  </div>
  <div class="footer"><div class="hazard-bar"></div><div class="footer-content"><span class="badge version-badge">v1.2.0</span><span class="badge scope-badge">Cookies only</span></div></div>
</div>
<div class="popup">
  <div class="header"><span class="logo-title">1132 FIXER</span><div class="logo-sep"></div><span class="logo-desc">Zoom Cookie Cleaner</span></div>
  <div class="main">
    <span class="status-badge neutral"><span class="status-dot"></span>NOT ZOOM</span>
    <p class="result">Open a zoom.us or zoom.com tab, then click this icon again.</p>
  </div>
  <div class="footer"><div class="hazard-bar"></div><div class="footer-content"><span class="badge version-badge">v1.2.0</span><span class="badge scope-badge">Cookies only</span></div></div>
</div>
