<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>1132 Fixer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <img class="logo-mark" src="icons/icon128.png" alt="" width="56" height="56">
    <span class="logo-title">1132 FIXER</span>
    <div class="logo-sep" aria-hidden="true"></div>
    <span class="logo-desc">Zoom Cookie Cleaner</span>
  </header>

  <main class="main">
    <div class="status-badge" id="statusBadge">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusBadgeText">Ready</span>
    </div>

    <button id="zoomFixBtn" class="btn-zoom" type="button" hidden>FIX ZOOM</button>

    <p class="result" id="result" role="status" aria-live="polite">Checking this tab&hellip;</p>
  </main>

  <footer class="footer">
    <div class="hazard-bar" aria-hidden="true"></div>
    <div class="footer-content">
      <span class="badge version-badge" id="appVersion">v1.2.1</span>
      <span class="badge scope-badge">Cookies only</span>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
